<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ooppss... where we going? - 404 Not Found</title>
    <style>
        body {
            background: #050505;
            color: #00ffea;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-transform: uppercase;
        }

        .glitch-wrapper {
            text-align: center;
        }

        .glitch {
            font-size: 5rem;
            font-weight: bold;
            position: relative;
            text-shadow: 0.05em 0 0 #ff0055, -0.05em -0.025em 0 #00ffea,
                         0.025em 0.05em 0 #ffff00;
            animation: glitch 500ms infinite;
        }

        @keyframes glitch {
            0% {
                text-shadow: 0.05em 0 0 #ff0055, -0.05em -0.025em 0 #00ffea,
                             0.025em 0.05em 0 #ffff00;
            }
            14% {
                text-shadow: 0.05em 0 0 #ff0055, -0.05em -0.025em 0 #00ffea,
                             0.025em 0.05em 0 #ffff00;
            }
            15% {
                text-shadow: -0.05em -0.025em 0 #ff0055, 0.025em 0.025em 0 #00ffea,
                             -0.05em 0.05em 0 #ffff00;
            }
            49% {
                text-shadow: -0.05em -0.025em 0 #ff0055, 0.025em 0.025em 0 #00ffea,
                             -0.05em 0.05em 0 #ffff00;
            }
            50% {
                text-shadow: 0.025em 0.05em 0 #ff0055, 0.05em 0 0 #00ffea,
                             0 -0.05em 0 #ffff00;
            }
            99% {
                text-shadow: 0.025em 0.05em 0 #ff0055, 0.05em 0 0 #00ffea,
                             0 -0.05em 0 #ffff00;
            }
            100% {
                text-shadow: -0.025em 0 0 #ff0055, -0.025em -0.025em 0 #00ffea,
                             -0.025em -0.05em 0 #ffff00;
            }
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.06),
                rgba(0, 255, 0, 0.02),
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="glitch-wrapper">
        <h1 class="glitch">What are you looking for?</h1>
        <p>404 Not Found</p>
    </div>
</body>
</html>
